[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reading-companion"
version = "0.1.0"
description = "A FastAPI backend for an AI reading companion"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27", "pydantic-settings>=2.2"]

[tool.setuptools.packages.find]
include = ["app*"]
